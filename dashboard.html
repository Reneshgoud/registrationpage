<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Aurora Auth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b14;
    --panel:#0f1729;
    --teal:#2de1c2;
    --violet:#8b7cff;
    --ink:#eaf1ff;
    --muted:#8291ad;
    --line:rgba(234,241,255,.09);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(50% 40% at 15% 0%, rgba(139,124,255,.18), transparent 60%),
      radial-gradient(40% 35% at 90% 10%, rgba(45,225,194,.14), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 40px;
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:26px;height:26px;border-radius:7px; background:linear-gradient(135deg, var(--teal), var(--violet)); }
  .brand-name{ font-family:'Space Grotesk',sans-serif; font-size:16.5px; font-weight:600; }
  a.logout{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--line);
    padding:9px 14px;
    border-radius:9px;
    transition:color .15s ease, border-color .15s ease;
  }
  a.logout:hover{ color:var(--ink); border-color:var(--teal); }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
  }
  .card{
    width:100%;
    max-width:460px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 10px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 6px;
  }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 28px; }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 0;
    border-top:1px solid var(--line);
    font-size:14px;
  }
  .row:last-child{ border-bottom:1px solid var(--line); }
  .row .k{ color:var(--muted); }
  .row .v{ font-weight:500; }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Aurora Auth</div>
    </div>
    <a class="logout" href="{{ url_for('logout') }}">Log out</a>
  </header>

  <main>
    <div class="card">
      <p class="eyebrow">Account</p>
      <h1>Welcome, {{ user['full_name'] }}</h1>
      <p class="sub">Here's what we have on file for your account.</p>

      <div class="row"><span class="k">Full name</span><span class="v">{{ user['full_name'] }}</span></div>
      <div class="row"><span class="k">Email</span><span class="v">{{ user['email'] }}</span></div>
      <div class="row"><span class="k">Member since</span><span class="v">{{ user['created_at'] }}</span></div>
    </div>
  </main>

</body>
</html>
